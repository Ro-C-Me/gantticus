<!-- Temporäre Lösung: Gantt Feature lädt die komplette alte Logik -->
<div class="gantt-feature-container d-flex flex-column h-100">
  <!-- Header mit Gantt-spezifischen Controls -->
  <header class="d-flex align-items-center p-3 mb-3 bg-light border-bottom">
    <div class="d-flex align-items-left">
      <div ngbDropdown class="btn-group">
        <button class="btn btn-primary" (click)="onAddTask()">
          <i class="bi bi-plus-lg"></i> Neuer Task
        </button>
        <button class="btn btn-primary dropdown-toggle dropdown-toggle-split" ngbDropdownToggle>
          <span class="visually-hidden">Dropdown öffnen</span>
        </button>
        <div ngbDropdownMenu>
          <button class="dropdown-item" (click)="onAddTask()">Task hinzufügen</button>
          <button class="dropdown-item" (click)="onAddGroup()">Gruppe hinzufügen</button>
        </div>
      </div>
      
      <!-- Undo/Redo Buttons -->
      <div class="btn-group ms-2">
        <button class="btn btn-outline-secondary" [disabled]="!canUndo" title="Rückgängig" (click)="onUndo()">
          <i class="bi bi-arrow-counterclockwise"></i>
        </button>
        <button class="btn btn-outline-secondary" [disabled]="!canRedo" title="Wiederherstellen" (click)="onRedo()">
          <i class="bi bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>
    <div class="flex-grow-1"></div>
    <!-- Name des Charts, mittig und anklickbar -->
    <div class="d-flex align-items-center">
      <h1
        class="h4 mb-0 text-center cursor-pointer name-editable"
        *ngIf="!isEditingName"
        (click)="onEditName()"
        (keyup.enter)="onEditName()"
        (keyup.space)="onEditName()"
        tabindex="0"
        aria-label="Name bearbeiten"
        role="button"
      >
        {{ chart.name }}
        <i class="bi bi-pencil-square ms-2"></i>
      </h1>
      <div *ngIf="isEditingName" class="d-flex align-items-center">
        <input
          type="text"
          class="form-control form-control-sm input-h4 "
          [(ngModel)]="chart.name"
          (keyup.enter)="onSaveName(chart.name)"
          (blur)="onSaveName(chart.name)"
          #nameInput
          (click)="$event.stopPropagation()"
        />

        <button class="btn btn-sm btn-success ms-2" (click)="onSaveName(chart.name)">
          <i class="bi bi-check"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary ms-2" (click)="onCancelEdit()">
          <i class="bi bi-x"></i>
        </button>
      </div>
    </div>
    
    <!-- Navbar Actions rechts -->
    <div class="flex-grow-1 d-flex justify-content-end">
      <div class="d-flex align-items-center gap-2">
        <div ngbDropdown class="btn-group">
          <button class="btn btn-outline-secondary" ngbDropdownToggle>
            <i class="bi bi-folder2-open"></i> Öffnen
          </button>
          <div ngbDropdownMenu class="dropdown-menu-end max-dropdown-width">
            <button class="dropdown-item text-wrap" (click)="onOpenChart(c)" *ngFor="let c of availableCharts">
              {{ c.name }}
            </button>
          </div>
        </div>
        <button class="btn btn-primary" (click)="onNewChart()">
          <i class="bi bi-plus-lg"></i>
        </button>
        
        <button class="btn btn-outline-danger" (click)="onDeleteChart(chart)">
          <i class="bi bi-trash"></i> Löschen
        </button>
        <button class="btn btn-primary" (click)="onSave()" [disabled]="!hasUnsavedChanges">
          <i class="bi bi-save"></i> Speichern
        </button>
        
        <!-- Export-Dropdown -->
        <div ngbDropdown class="btn-group">
          <button class="btn btn-outline-secondary" (click)="onImageExport()" title="Gantt-Chart als Bild exportieren">
            <i class="bi bi-image"></i>
          </button>
          <button class="btn btn-outline-secondary dropdown-toggle dropdown-toggle-split" ngbDropdownToggle>
            <span class="visually-hidden">Export-Optionen öffnen</span>
          </button>
          <div ngbDropdownMenu>
            <button class="dropdown-item" (click)="onImageExport()">
              <i class="bi bi-image"></i> Image Export
            </button>
            <button class="dropdown-item" (click)="onHtmlExport()">
              <i class="bi bi-table"></i> HTML Export
            </button>
            <button class="dropdown-item" (click)="onCsvExport()">
              <i class="bi bi-clipboard"></i> CSV Export
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Filter-Bereich -->
  <div class="container-fluid py-2 bg-light border-bottom">
    <div class="row">
      <div class="col-md-4">
        <div class="input-group input-group-sm">
          <span class="input-group-text">
            <i class="bi bi-search"></i>
          </span>
          <input
            type="text"
            class="form-control"
            placeholder="Tasks filtern..."
            [(ngModel)]="chart.filter.taskFilter"
            (input)="onFilterChange()"
            aria-label="Task-Filter"
          />
          <button
            class="btn btn-outline-secondary"
            type="button"
            (click)="clearFilter()"
            [disabled]="!chart.filter.taskFilter"
            title="Filter zurücksetzen"
          >
            <i class="bi bi-x"></i>
          </button>
        </div>
      </div>
      <div class="col-md-4">
        <div class="d-flex gap-2 align-items-center">
          <!-- Dependency Button Group -->
          <div class="btn-group" role="group" aria-label="Abhängigkeitsfilter">
            <!-- Upstream Dependencies Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="upstreamDeps" 
              [(ngModel)]="chart.filter.showUpstreamDeps"
              (change)="onFilterChange()"
            >
            <label
              class="btn btn-outline-secondary btn-sm" 
              for="upstreamDeps"
              title="Nachfolger anzeigen (Tasks, die von den gefundenen abhängen)"
            >
              <i class="bi bi-arrow-up-circle me-1"></i>
            </label>

            <!-- Downstream Dependencies Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="downstreamDeps" 
              [(ngModel)]="chart.filter.showDownstreamDeps"
              (change)="onFilterChange()"
            >
            <label 
              class="btn btn-outline-secondary btn-sm" 
              for="downstreamDeps"
              title="Abhängigkeiten anzeigen (Tasks, von denen die gefundenen abhängen)"
            >
              <i class="bi bi-arrow-down-circle me-1"></i>
            </label>
          </div>
          <!-- Status Filter Button Group -->
          <div class="btn-group" role="group" aria-label="Status-Filter">
            <!-- Open Tasks Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="showOpenTasks" 
              [(ngModel)]="chart.filter.showOpenTasks"
              (change)="onFilterChange()"
            >
            <label 
              class="btn btn-outline-secondary btn-sm" 
              for="showOpenTasks"
              title="Open Tasks anzeigen"
            >
              <i class="bi bi-circle"></i>
            </label>

            <!-- In Progress Tasks Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="showInProgressTasks" 
              [(ngModel)]="chart.filter.showInProgressTasks"
              (change)="onFilterChange()"
            >
            <label 
              class="btn btn-outline-secondary btn-sm" 
              for="showInProgressTasks"
              title="In Progress Tasks anzeigen"
            >
              <i class="bi bi-arrow-clockwise"></i>
            </label>

            <!-- Done Tasks Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="showDoneTasks" 
              [(ngModel)]="chart.filter.showDoneTasks"
              (change)="onFilterChange()"
            >
            <label 
              class="btn btn-outline-secondary btn-sm" 
              for="showDoneTasks"
              title="Abgeschlossene Tasks anzeigen"
            >
              <i class="bi bi-check-circle"></i>
            </label>

            <!-- Archived Tasks Toggle -->
            <input 
              type="checkbox" 
              class="btn-check" 
              id="showArchivedTasks" 
              [(ngModel)]="chart.filter.showArchivedTasks"
              (change)="onFilterChange()"
            >
            <label 
              class="btn btn-outline-secondary btn-sm" 
              for="showArchivedTasks"
              title="Archivierte Tasks anzeigen"
            >
              <i class="bi bi-archive"></i>
            </label>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Gantt-Chart-Komponente -->
  <app-gantt-chart
    [filteredTaskIds]="filteredTaskIds"
    [expanded]="chart.expanded"
    [chartId]="'gantt-chart'"
    (dataChanged)="onGanttDataChanged($event)"
    (expandedChanged)="onGanttExpandedChanged($event)"
    (taskAddRequest)="onAddTask($event)">
  </app-gantt-chart>
</div>
