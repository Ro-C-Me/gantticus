<div class="time-tracking-container p-4">
  <div class="row">
    <div class="col-12">
      <h2><i class="bi bi-stopwatch me-2"></i>{{ title }}</h2>
      <p class="text-muted">Zeiterfassung für Projekte und Aufgaben</p>
      
      <div class="alert alert-info mt-4">
        <i class="bi bi-info-circle me-2"></i>
        <strong>Coming Soon!</strong> Die Time Tracking Funktionalität wird bald verfügbar sein.
      </div>

      <div class="card mt-4">
        <div class="card-body">
          <h5 class="card-title">Geplante Features</h5>
          <ul>
            <li>Zeiterfassung mit Start/Stop Timer</li>
            <li>Manuelle Zeitbuchungen</li>
            <li>Verknüpfung mit Gantt-Tasks</li>
            <li>Zeitauswertungen und Reports</li>
            <li>Export-Funktionen</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</div>
