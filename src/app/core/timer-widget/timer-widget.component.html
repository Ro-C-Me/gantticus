<div class="timer-widget d-flex align-items-center gap-2">
  <!-- Projekt-Auswahl Dropdown (nur wenn NICHT läuft) -->
  <div class="project-select" *ngIf="!isRunning">
    <select 
      class="form-select form-select-sm"
      [(ngModel)]="selectedProjectName"
      title="Projekt auswählen"
    >
      <option value="">Kein Projekt</option>
      <option *ngFor="let project of availableProjects" [value]="project">
        {{ project }}
      </option>
    </select>
  </div>

  <!-- Projekt-Auswahl während Block läuft -->
  <div class="project-select" *ngIf="isRunning && !showNewProjectInput">
    <select 
      class="form-select form-select-sm"
      [(ngModel)]="selectedProjectName"
      (ngModelChange)="onRunningProjectChange($event)"
      title="Projekt zuordnen/ändern"
    >
      <option value="">Kein Projekt</option>
      <option *ngFor="let project of availableProjects" [value]="project">
        {{ project }}
      </option>
      <option value="__new__">+ Neues Projekt</option>
    </select>
  </div>

  <!-- Neues Projekt Input (nur während Block läuft) -->
  <div class="new-project-input d-flex gap-1" *ngIf="isRunning && showNewProjectInput">
    <input 
      type="text"
      class="form-control form-control-sm"
      id="newProjectInputWidget"
      [(ngModel)]="newProjectName"
      (keyup.enter)="createNewProjectForRunningBlock()"
      (keyup.escape)="cancelNewProject()"
      placeholder="Neues Projekt..."
      maxlength="50"
    />
    <button 
      class="btn btn-sm btn-success"
      (click)="createNewProjectForRunningBlock()"
      title="Erstellen"
    >
      <i class="bi bi-check"></i>
    </button>
    <button 
      class="btn btn-sm btn-secondary"
      (click)="cancelNewProject()"
      title="Abbrechen"
    >
      <i class="bi bi-x"></i>
    </button>
  </div>

  <!-- Timer-Anzeige -->
  <div 
    class="timer-display d-flex align-items-center gap-1"
    ngbPopover
    [popoverTitle]="isRunning ? 'Arbeitszeit läuft' : 'Arbeitszeit'"
    [ngbPopover]="popoverContent"
    triggers="mouseenter:mouseleave"
    placement="bottom"
  >
    <i class="bi bi-stopwatch"></i>
    <span class="timer-value">{{ formatDuration(todayTotalMs) }}</span>
  </div>

  <!-- Start/Stop Button -->
  <button 
    *ngIf="!isRunning"
    class="btn btn-sm btn-success ms-2"
    (click)="onStartWork()"
    title="Arbeit starten"
  >
    <i class="bi bi-play-fill"></i>
  </button>

  <button 
    *ngIf="isRunning"
    class="btn btn-sm btn-warning ms-2"
    (click)="onStopWork()"
    title="Arbeit beenden"
  >
    <i class="bi bi-pause-fill"></i>
  </button>
</div>

<!-- Popover Template -->
<ng-template #popoverContent>
  <div class="timer-popover">
    <div *ngIf="isRunning && currentBlock" class="mb-2">
      <div class="text-success fw-bold">
        <i class="bi bi-circle-fill text-success" style="font-size: 0.5rem;"></i>
        Aktueller Block
      </div>
      <div class="small text-muted">
        Gestartet: {{ formatTime(currentBlock.start) }}
      </div>
      <div class="small">
        Laufzeit: {{ formatDuration(getCurrentBlockDuration()) }}
      </div>
    </div>

    <div class="border-top pt-2" [class.mt-2]="isRunning">
      <div class="fw-bold">Gesamt heute:</div>
      <div>{{ formatDuration(todayTotalMs) }}</div>
    </div>
  </div>
</ng-template>
